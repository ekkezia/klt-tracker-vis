<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wren's route: Chinatown simulator</title>
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/" } }
  </script>
  <style>
    html, body { margin: 0; height: 100%; background: #111; color: #eee; font: 13px system-ui, sans-serif; overflow: hidden; }
    canvas { display: block; }
    .ui { position: fixed; left: 12px; right: 12px; bottom: 12px; display: flex; gap: 10px; align-items: center;
          background: rgba(10, 12, 16, .8); padding: 8px 12px; border-radius: 10px; }
    .ui input[type=range] { flex: 1; }
    .ui button { background: #222; color: #eee; border: 1px solid #444; border-radius: 6px; padding: 4px 9px; cursor: pointer; }
    .ui button[aria-pressed=true] { border-color: #7dd3fc; color: #7dd3fc; }
    #chapters { display: flex; gap: 4px; }
    .top { position: fixed; left: 12px; top: 10px; background: rgba(10, 12, 16, .7); padding: 6px 10px; border-radius: 8px; }
    .attr { position: fixed; right: 12px; top: 10px; font-size: 11px; opacity: .8; background: rgba(10, 12, 16, .6); padding: 4px 8px; border-radius: 6px; }
    body.recording .ui, body.recording .top, body.recording .attr { display: none; }
  </style>
  <script type="module" src="./main.js"></script>
</head>
<body>
  <canvas id="view"></canvas>
  <p class="top" id="status">Loading Chinatown…</p>
  <p class="attr">Map data © <a href="https://www.openstreetmap.org/copyright" style="color:inherit">OpenStreetMap</a> contributors · textures CC0 Poly Haven</p>
  <div class="ui">
    <button id="play">Play</button>
    <div id="chapters" aria-label="Jump to chapter"></div>
    <input id="scrub" type="range" min="0" max="0" value="0" aria-label="Frame">
    <span id="label"></span>
    <button id="overview" aria-pressed="false" title="Bird's-eye view (O)">Overview</button>
  </div>
</body>
</html>
