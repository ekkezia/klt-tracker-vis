<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>
  <rect width="680" height="360" fill="#fff"/>

  <g stroke-width="1.5">
    <rect x="80" y="125" width="230" height="110" rx="10" fill="#e8f1fb" stroke="#1f5f8b"/>
    <rect x="440" y="25" width="220" height="70" rx="10" fill="#fdf2e6" stroke="#b4541c"/>
    <rect x="440" y="265" width="220" height="70" rx="10" fill="#fcecec" stroke="#b91c1c"/>
  </g>

  <g text-anchor="middle" fill="#222">
    <text x="195" y="152" font-size="15" font-weight="700">1. Detect / replenish</text>
    <text x="195" y="171" font-size="12.5">Shi–Tomasi corners</text>
    <text x="195" y="196" font-size="11.5" fill="#666">First frame: whole image</text>
    <text x="195" y="212" font-size="11.5" fill="#666">Later: empty regions, when &lt; N tracks</text>

    <text x="550" y="55" font-size="15" font-weight="700">2. Track</text>
    <text x="550" y="75" font-size="12.5">Pyramidal Lucas–Kanade</text>

    <text x="550" y="295" font-size="15" font-weight="700">3. Verify</text>
    <text x="550" y="315" font-size="12.5">FB error, residual, weak corner</text>

    <text x="440" y="176" font-size="15" font-weight="700">Every frame</text>
    <text x="440" y="195" font-size="12.5" fill="#666">Keeps ~N tracks alive</text>
  </g>

  <g stroke="#444" stroke-width="1.75" fill="none" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M10 180 H 76"/>
    <path d="M310 150 L 436 68"/>
    <path d="M550 95 V 261"/>
    <path d="M440 300 L 314 213"/>
  </g>

  <g font-size="12" font-style="italic" fill="#555">
    <text x="40" y="170" text-anchor="middle">Start</text>
    <text x="350" y="92" text-anchor="middle">N tracks</text>
    <text x="560" y="140" text-anchor="start">New positions</text>
    <text x="430" y="324" text-anchor="end">Surviving tracks → next frame</text>
  </g>
</svg>
